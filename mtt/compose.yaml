services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browser sees localhost:8080; the BFF reaches it as keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks: [mtt]

  api:
    build: ./api
    environment:
      KEYCLOAK_PUBLIC_URL: http://localhost:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      REALM: tenants
      WEB_CLIENT_ID: mtt-web
      APP_BASE_URL: http://localhost:8000
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_HOST: ${SNOWFLAKE_HOST}
      SNOWFLAKE_USER: MTT_APP_SVC
      SNOWFLAKE_ROLE: MTT_APP_ROLE
      SNOWFLAKE_DATABASE: MTT_DB
      SNOWFLAKE_SCHEMA: SERVING
      SNOWFLAKE_WAREHOUSE: MTT_WH
      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/app_svc.p8
      SERVER_PORT: 8001
    env_file:
      - path: auth/web.env
        required: false
    volumes:
      - ./keys/app_svc.p8:/run/secrets/app_svc.p8:ro
    ports:
      - "8001:8001"
    depends_on: [keycloak]
    networks: [mtt]

  web:
    build: ./web
    environment:
      API_URL: http://api:8001
    ports:
      - "8000:8000"
    depends_on: [api]
    networks: [mtt]

networks:
  mtt:

volumes:
  keycloak_data:
